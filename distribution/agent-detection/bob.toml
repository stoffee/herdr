id = "bob"
version = "2026.07.19.1"
min_engine_version = 1
updated_at = "2026-07-19T00:00:00Z"
aliases = ["bob-shell"]

[[rules]]
id = "tool_permission"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(24)"
visible_blocker = true
contains = ["Approve Once", "Always Allow Command for task", "Reject", "Press Enter to confirm"]

[[rules]]
id = "inline_question"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(24)"
visible_blocker = true
line_regex = ['^\s*Bob is asking a question\s*$', '^\s*>\s+\S']
contains = ["(Tab)", "Shift+Tab"]

[[rules]]
id = "active_turn"
state = "working"
priority = 200
region = "bottom_non_empty_lines(20)"
visible_working = true
any = [
  { line_regex = ['^\s*[\x{2801}-\x{28FF}]\s+\S'] },
  { contains = ["Thinking... (esc to cancel)"] },
]

[[rules]]
id = "composer_idle"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(12)"
visible_idle = true
line_regex = ['^\s*❯(?:\s.*)?$']
contains = ["─"]
